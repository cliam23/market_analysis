app = "market-analysis-liam"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"

[[services]]
  internal_port = 3001
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"
    path = "/health"
    method = "GET"

  [services.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 40

[mounts]
  source = "market_data"
  destination = "/data"
